  morning: { label: "Morning", color: "#f59e0b", bg: "rgba(245,158,11,0.12)" },
  evening: { label: "Evening", color: "#818cf8", bg: "rgba(129,140,248,0.12)" },
  fitness: { label: "Fitness", color: "#34d399", bg: "rgba(52,211,153,0.12)" },
  health:  { label: "Health",  color: "#f87171", bg: "rgba(248,113,113,0.12)" },
};

const todayStr = () => new Date().toISOString().split("T")[0];

const FlameIcon = ({ size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2c0 0-5 5-5 10a5 5 0 0010 0c0-2-1-4-2-5 0 2-1 3-2 3-1 0-2-1-2-3 0-1 1-3 1-5z"/>
  </svg>
);
const PlusIcon = () => <svg width={15} height={15} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.5}><path d="M12 5v14M5 12h14"/></svg>;
const CheckIcon = () => <svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={3}><path d="M5 12l5 5L20 7"/></svg>;
const XIcon = ({ size = 13 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.5}><path d="M18 6L6 18M6 6l12 12"/></svg>;
const ChevronRight = () => <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2}><path d="M9 18l6-6-6-6"/></svg>;
const PackageIcon = ({ size = 13 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2}><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>;
const TaskIcon = ({ size = 13 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2}><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>;

export default function RoutineTracker() {
  const [routines, setRoutines] = useState(() => {
    try { const s = localStorage.getItem("rt2-routines"); return s ? JSON.parse(s) : DEFAULT_ROUTINES; }
    catch { return DEFAULT_ROUTINES; }
  });
  const [completed, setCompleted] = useState(() => {
    try { const s = localStorage.getItem("rt2-completed"); return s ? JSON.parse(s) : {}; }
    catch { return {}; }
  });
  const [activeFilter, setActiveFilter] = useState("all");
  const [showAdd, setShowAdd] = useState(false);
  const [detail, setDetail] = useState(null);
  const [detailTab, setDetailTab] = useState("tasks");
  const [newRoutine, setNewRoutine] = useState({ name: "", category: "morning", emoji: "⭐", time: "08:00", days: [1,2,3,4,5] });
  const [newTask, setNewTask] = useState("");
  const [newProduct, setNewProduct] = useState({ name: "", note: "" });

  const today = todayStr();

  useEffect(() => { try { localStorage.setItem("rt2-routines", JSON.stringify(routines)); } catch {} }, [routines]);
  useEffect(() => { try { localStorage.setItem("rt2-completed", JSON.stringify(completed)); } catch {} }, [completed]);

  const todayRoutines = routines.filter(r => r.days.includes(TODAY));
  const filteredRoutines = activeFilter === "all" ? todayRoutines : todayRoutines.filter(r => r.category === activeFilter);
  const isCompleted = (id) => completed[today]?.includes(id);

  const toggle = (id) => {
    const wasDone = isCompleted(id);
    setCompleted(prev => {
      const arr = prev[today] || [];
      return { ...prev, [today]: wasDone ? arr.filter(x => x !== id) : [...arr, id] };
    });
    setRoutines(prev => prev.map(r => r.id === id ? { ...r, streak: wasDone ? Math.max(0, r.streak - 1) : r.streak + 1 } : r));
  };

  const updateRoutine = (id, patch) => setRoutines(prev => prev.map(r => r.id === id ? { ...r, ...patch } : r));
  const deleteRoutine = (id) => { setRoutines(prev => prev.filter(r => r.id !== id)); if (detail === id) setDetail(null); };

  const addTask = (rid) => {
    if (!newTask.trim()) return;
    const r = routines.find(x => x.id === rid);
    updateRoutine(rid, { tasks: [...(r?.tasks || []), { id: `t${Date.now()}`, text: newTask.trim(), done: false }] });
    setNewTask("");
  };
  const toggleTask = (rid, tid) => {
    const r = routines.find(x => x.id === rid);
    updateRoutine(rid, { tasks: r.tasks.map(t => t.id === tid ? { ...t, done: !t.done } : t) });
  };
  const deleteTask = (rid, tid) => {
    const r = routines.find(x => x.id === rid);
    updateRoutine(rid, { tasks: r.tasks.filter(t => t.id !== tid) });
  };

  const addProduct = (rid) => {
    if (!newProduct.name.trim()) return;
    const r = routines.find(x => x.id === rid);
    updateRoutine(rid, { products: [...(r?.products || []), { id: `p${Date.now()}`, name: newProduct.name.trim(), note: newProduct.note.trim() }] });
    setNewProduct({ name: "", note: "" });
  };
  const deleteProduct = (rid, pid) => {
    const r = routines.find(x => x.id === rid);
    updateRoutine(rid, { products: r.products.filter(p => p.id !== pid) });
  };

  const addRoutine = () => {
    if (!newRoutine.name.trim()) return;
    setRoutines(prev => [...prev, { ...newRoutine, id: Date.now(), streak: 0, completedDates: [], tasks: [], products: [] }]);
    setNewRoutine({ name: "", category: "morning", emoji: "⭐", time: "08:00", days: [1,2,3,4,5] });
    setShowAdd(false);
  };
  const toggleDay = (day) => setNewRoutine(prev => ({
    ...prev, days: prev.days.includes(day) ? prev.days.filter(d => d !== day) : [...prev.days, day]
  }));

  const completedCount = filteredRoutines.filter(r => isCompleted(r.id)).length;
  const totalCount = filteredRoutines.length;
  const pct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
  const dayLabel = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  const topStreak = routines.reduce((max, r) => r.streak > max ? r.streak : max, 0);
  const detailRoutine = detail ? routines.find(r => r.id === detail) : null;

  const EMOJIS = ["⭐","💧","🧘","🏋️","🚶","🥗","💊","📖","✍️","🌙","☀️","🎯","🏃","🧠","❤️","🍵","🎵","🌿"];

  const S = { // shared input style
    width: "100%", padding: "10px 12px", borderRadius: "10px",
    background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)",
    color: "#e8eaf0", fontSize: "13px", outline: "none", boxSizing: "border-box", fontFamily: "inherit"
  };

  return (
    <div style={{ minHeight: "100vh", background: "#0c0f1a", fontFamily: "'DM Sans','Segoe UI',sans-serif", color: "#e8eaf0", position: "relative" }}>
      <div style={{ position: "fixed", top: "-100px", right: "-100px", width: "400px", height: "400px", borderRadius: "50%", background: "radial-gradient(circle, rgba(129,140,248,0.08) 0%, transparent 70%)", pointerEvents: "none" }} />
      <div style={{ position: "fixed", bottom: "-80px", left: "-80px", width: "300px", height: "300px", borderRadius: "50%", background: "radial-gradient(circle, rgba(52,211,153,0.07) 0%, transparent 70%)", pointerEvents: "none" }} />

      <div style={{ maxWidth: "480px", margin: "0 auto", padding: "24px 16px 100px" }}>

        {/* Header */}
        <div style={{ marginBottom: "22px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontSize: "11px", color: "#6b7280", fontWeight: 500, letterSpacing: "0.07em", textTransform: "uppercase", marginBottom: "3px" }}>{dayLabel}</div>
            <h1 style={{ fontSize: "26px", fontWeight: 700, margin: 0, background: "linear-gradient(135deg,#e8eaf0 0%,#a5b4fc 100%)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>My Routines</h1>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: "5px", background: "rgba(245,158,11,0.12)", border: "1px solid rgba(245,158,11,0.25)", borderRadius: "20px", padding: "5px 11px" }}>
            <span style={{ color: "#f59e0b" }}><FlameIcon size={13} /></span>
            <span style={{ fontSize: "12px", fontWeight: 600, color: "#f59e0b" }}>{topStreak}d streak</span>
          </div>
        </div>

        {/* Progress */}
        <div style={{ background: "linear-gradient(135deg,rgba(255,255,255,0.04),rgba(255,255,255,0.01))", border: "1px solid rgba(255,255,255,0.08)", borderRadius: "20px", padding: "18px 20px", marginBottom: "16px", display: "flex", alignItems: "center", gap: "18px" }}>
          <div style={{ position: "relative", flexShrink: 0 }}>
            <svg width={72} height={72} viewBox="0 0 72 72">
              <circle cx={36} cy={36} r={30} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={7} />
              <circle cx={36} cy={36} r={30} fill="none" stroke="url(#pg)" strokeWidth={7}
                strokeDasharray={`${2*Math.PI*30}`} strokeDashoffset={`${2*Math.PI*30*(1-pct/100)}`}
                strokeLinecap="round" transform="rotate(-90 36 36)" style={{ transition: "stroke-dashoffset 0.5s ease" }} />
              <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#818cf8"/><stop offset="100%" stopColor="#34d399"/></linearGradient></defs>
            </svg>
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <span style={{ fontSize: "15px", fontWeight: 700 }}>{pct}%</span>
            </div>
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: "14px", fontWeight: 600, marginBottom: "5px" }}>
              {pct === 100 ? "🎉 All done!" : pct > 50 ? "Great momentum!" : "Let's get going!"}
            </div>
            <div style={{ fontSize: "12px", color: "#9ca3af" }}><span style={{ color: "#e8eaf0", fontWeight: 600 }}>{completedCount}</span> / <span style={{ color: "#e8eaf0", fontWeight: 600 }}>{totalCount}</span> completed</div>
            <div style={{ display: "flex", gap: "5px", marginTop: "9px", flexWrap: "wrap" }}>
              {Object.entries(CATEGORIES).map(([key, cat]) => {
                const c = todayRoutines.filter(r => r.category === key);
                const d = c.filter(r => isCompleted(r.id)).length;
                return c.length > 0 ? (
                  <div key={key} style={{ fontSize: "10px", background: cat.bg, color: cat.color, border: `1px solid ${cat.color}28`, borderRadius: "7px", padding: "2px 7px", fontWeight: 500 }}>
                    {cat.label} {d}/{c.length}
                  </div>
                ) : null;
              })}
            </div>
          </div>
        </div>

        {/* Filters */}
        <div style={{ display: "flex", gap: "6px", marginBottom: "13px", overflowX: "auto", paddingBottom: "2px" }}>
          {[{ key: "all", label: "All" }, ...Object.entries(CATEGORIES).map(([k, v]) => ({ key: k, label: v.label }))].map(f => (
            <button key={f.key} onClick={() => setActiveFilter(f.key)} style={{
              flexShrink: 0, padding: "5px 13px", borderRadius: "20px",
              border: activeFilter === f.key ? "1px solid rgba(129,140,248,0.5)" : "1px solid rgba(255,255,255,0.08)",
              background: activeFilter === f.key ? "rgba(129,140,248,0.15)" : "rgba(255,255,255,0.03)",
              color: activeFilter === f.key ? "#a5b4fc" : "#6b7280",
              fontSize: "12px", fontWeight: 500, cursor: "pointer"
            }}>{f.label}</button>
          ))}
        </div>

        {/* Routine list */}
        <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginBottom: "14px" }}>
          {filteredRoutines.length === 0 && <div style={{ textAlign: "center", padding: "32px", color: "#4b5563", fontSize: "13px" }}>No routines for today in this category</div>}
          {filteredRoutines.sort((a, b) => a.time.localeCompare(b.time)).map(routine => {
            const done = isCompleted(routine.id);
            const cat = CATEGORIES[routine.category];
            const tasksDone = routine.tasks?.filter(t => t.done).length || 0;
            const tasksTotal = routine.tasks?.length || 0;
            const prodsTotal = routine.products?.length || 0;
            return (
              <div key={routine.id} style={{
                background: done ? "rgba(52,211,153,0.05)" : "rgba(255,255,255,0.03)",
                border: done ? "1px solid rgba(52,211,153,0.18)" : "1px solid rgba(255,255,255,0.07)",
                borderRadius: "14px", padding: "11px 13px",
                display: "flex", alignItems: "center", gap: "11px", transition: "all 0.2s"
              }}>
                <div onClick={() => toggle(routine.id)} style={{
                  width: "32px", height: "32px", borderRadius: "50%", flexShrink: 0, cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  background: done ? "rgba(52,211,153,0.18)" : "rgba(255,255,255,0.04)",
                  border: done ? "1.5px solid #34d399" : "1.5px solid rgba(255,255,255,0.12)",
                  color: done ? "#34d399" : "transparent", transition: "all 0.2s"
                }}>{done && <CheckIcon />}</div>
                <div style={{ fontSize: "19px", flexShrink: 0 }}>{routine.emoji}</div>
                <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={() => { setDetail(routine.id); setDetailTab("tasks"); setNewTask(""); setNewProduct({ name: "", note: "" }); }}>
                  <div style={{ fontSize: "14px", fontWeight: 600, textDecoration: done ? "line-through" : "none", color: done ? "#6b7280" : "#e8eaf0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{routine.name}</div>
                  <div style={{ display: "flex", alignItems: "center", gap: "7px", marginTop: "3px", flexWrap: "wrap" }}>
                    <span style={{ fontSize: "11px", color: "#6b7280" }}>{routine.time}</span>
                    <span style={{ fontSize: "10px", background: cat.bg, color: cat.color, borderRadius: "5px", padding: "1px 6px", fontWeight: 500 }}>{cat.label}</span>
                    {tasksTotal > 0 && (
                      <span style={{ fontSize: "10px", color: "#6b7280", display: "flex", alignItems: "center", gap: "3px" }}>
                        <TaskIcon /> {tasksDone}/{tasksTotal}
                      </span>
                    )}
                    {prodsTotal > 0 && (
                      <span style={{ fontSize: "10px", color: "#6b7280", display: "flex", alignItems: "center", gap: "3px" }}>
                        <PackageIcon /> {prodsTotal}
                      </span>
                    )}
                  </div>
                </div>
                <div style={{ flexShrink: 0, display: "flex", alignItems: "center", gap: "3px", color: routine.streak > 0 ? "#f59e0b" : "#374151" }}>
                  <FlameIcon size={12} /><span style={{ fontSize: "11px", fontWeight: 600 }}>{routine.streak}</span>
                </div>
                <div onClick={() => { setDetail(routine.id); setDetailTab("tasks"); setNewTask(""); setNewProduct({ name: "", note: "" }); }} style={{ color: "#4b5563", cursor: "pointer", flexShrink: 0 }}>
                  <ChevronRight />
                </div>
                <button onClick={() => deleteRoutine(routine.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#374151", padding: "2px", flexShrink: 0 }}
                  onMouseEnter={e => e.currentTarget.style.color = "#f87171"} onMouseLeave={e => e.currentTarget.style.color = "#374151"}>
                  <XIcon />
                </button>
              </div>
            );
          })}
        </div>

        {/* Week mini */}
        <div style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: "15px", padding: "13px 15px", marginBottom: "14px" }}>
          <div style={{ fontSize: "10px", color: "#6b7280", fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: "9px" }}>This Week</div>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            {DAYS.map((day, i) => {
              const isToday = i === TODAY;
              const dR = routines.filter(r => r.days.includes(i));
              const date = new Date(); date.setDate(date.getDate() - (TODAY - i));
              const ds = date.toISOString().split("T")[0];
              const dc = completed[ds]?.length || 0;
              const p = dR.length > 0 ? dc / dR.length : 0;
              return (
                <div key={day} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "5px" }}>
                  <div style={{ fontSize: "10px", color: isToday ? "#a5b4fc" : "#4b5563", fontWeight: isToday ? 600 : 400 }}>{day}</div>
                  <div style={{ width: "26px", height: "26px", borderRadius: "50%", background: isToday ? "rgba(129,140,248,0.15)" : "rgba(255,255,255,0.03)", border: isToday ? "1.5px solid #818cf8" : "1.5px solid rgba(255,255,255,0.07)", display: "flex", alignItems: "center", justifyContent: "center", position: "relative", overflow: "hidden" }}>
                    <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: `${p * 100}%`, background: p === 1 ? "rgba(52,211,153,0.3)" : "rgba(129,140,248,0.2)", transition: "height 0.4s ease" }} />
                    <span style={{ fontSize: "9px", fontWeight: 600, color: isToday ? "#a5b4fc" : "#6b7280", position: "relative" }}>{i > TODAY ? "" : `${Math.round(p * 100)}%`}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Add button */}
        <button onClick={() => setShowAdd(true)} style={{
          width: "100%", padding: "13px", borderRadius: "13px",
          background: "linear-gradient(135deg,rgba(129,140,248,0.15),rgba(52,211,153,0.1))",
          border: "1px dashed rgba(129,140,248,0.35)", color: "#a5b4fc", fontSize: "13px", fontWeight: 600,
          cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: "7px"
        }}>
          <PlusIcon /> Add New Routine
        </button>
      </div>

      {/* ── Detail Drawer ─────────────────────────────────────── */}
      {detailRoutine && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.65)", backdropFilter: "blur(8px)", zIndex: 100, display: "flex", alignItems: "flex-end", justifyContent: "center" }}
          onClick={() => setDetail(null)}>
          <div style={{ background: "#131726", border: "1px solid rgba(255,255,255,0.1)", borderRadius: "24px 24px 0 0", width: "100%", maxWidth: "480px", maxHeight: "85vh", display: "flex", flexDirection: "column" }}
            onClick={e => e.stopPropagation()}>

            {/* Drawer header (fixed) */}
            <div style={{ padding: "14px 20px 0", flexShrink: 0 }}>
              <div style={{ width: "36px", height: "4px", background: "rgba(255,255,255,0.12)", borderRadius: "2px", margin: "0 auto 14px" }} />
              <div style={{ display: "flex", alignItems: "center", gap: "11px", marginBottom: "14px" }}>
                <span style={{ fontSize: "22px" }}>{detailRoutine.emoji}</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: "15px", fontWeight: 700 }}>{detailRoutine.name}</div>
                  <div style={{ fontSize: "11px", color: "#6b7280" }}>{detailRoutine.time} · {CATEGORIES[detailRoutine.category].label}</div>
                </div>
                <button onClick={() => setDetail(null)} style={{ background: "none", border: "none", cursor: "pointer", color: "#6b7280", padding: "4px" }}><XIcon size={15} /></button>
              </div>
              {/* Tabs */}
              <div style={{ display: "flex", background: "rgba(255,255,255,0.04)", borderRadius: "11px", padding: "3px", marginBottom: "14px" }}>
                {[
                  { key: "tasks", label: "Tasks", icon: <TaskIcon size={12} />, count: `${detailRoutine.tasks?.filter(t=>t.done).length||0}/${detailRoutine.tasks?.length||0}` },
                  { key: "products", label: "Products", icon: <PackageIcon size={12} />, count: detailRoutine.products?.length || 0 }
                ].map(tab => (
                  <button key={tab.key} onClick={() => setDetailTab(tab.key)} style={{
                    flex: 1, padding: "7px", borderRadius: "8px", border: "none", cursor: "pointer",
                    background: detailTab === tab.key ? "rgba(129,140,248,0.2)" : "transparent",
                    color: detailTab === tab.key ? "#a5b4fc" : "#6b7280",
                    fontSize: "12px", fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: "5px", transition: "all 0.2s"
                  }}>
                    {tab.icon} {tab.label}
                    <span style={{ fontSize: "10px", background: "rgba(255,255,255,0.08)", borderRadius: "7px", padding: "1px 5px" }}>{tab.count}</span>
                  </button>
                ))}
              </div>
            </div>

            {/* Scrollable body */}
            <div style={{ flex: 1, overflowY: "auto", padding: "0 20px 28px" }}>

              {/* TASKS TAB */}
              {detailTab === "tasks" && (
                <div>
                  <div style={{ display: "flex", gap: "7px", marginBottom: "12px" }}>
                    <input value={newTask} onChange={e => setNewTask(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && addTask(detailRoutine.id)}
                      placeholder="Add a task step…" style={{ ...S, flex: 1 }} />
                    <button onClick={() => addTask(detailRoutine.id)} style={{ padding: "10px 13px", borderRadius: "10px", border: "none", background: "rgba(129,140,248,0.2)", color: "#a5b4fc", cursor: "pointer", flexShrink: 0 }}><PlusIcon /></button>
                  </div>
                  {(!detailRoutine.tasks || detailRoutine.tasks.length === 0) && (
                    <div style={{ textAlign: "center", padding: "22px", color: "#4b5563", fontSize: "13px" }}>No tasks yet — add step-by-step actions</div>
                  )}
                  <div style={{ display: "flex", flexDirection: "column", gap: "7px" }}>
                    {detailRoutine.tasks?.map(task => (
                      <div key={task.id} style={{
                        display: "flex", alignItems: "center", gap: "9px",
                        background: task.done ? "rgba(52,211,153,0.05)" : "rgba(255,255,255,0.03)",
                        border: task.done ? "1px solid rgba(52,211,153,0.15)" : "1px solid rgba(255,255,255,0.07)",
                        borderRadius: "10px", padding: "9px 11px"
                      }}>
                        <div onClick={() => toggleTask(detailRoutine.id, task.id)} style={{
                          width: "20px", height: "20px", borderRadius: "50%", flexShrink: 0, cursor: "pointer",
                          display: "flex", alignItems: "center", justifyContent: "center",
                          background: task.done ? "rgba(52,211,153,0.2)" : "transparent",
                          border: task.done ? "1.5px solid #34d399" : "1.5px solid rgba(255,255,255,0.18)",
                          color: task.done ? "#34d399" : "transparent", transition: "all 0.2s"
                        }}>{task.done && <CheckIcon />}</div>
                        <span style={{ flex: 1, fontSize: "13px", textDecoration: task.done ? "line-through" : "none", color: task.done ? "#6b7280" : "#e8eaf0" }}>{task.text}</span>
                        <button onClick={() => deleteTask(detailRoutine.id, task.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#374151", padding: "2px" }}
                          onMouseEnter={e => e.currentTarget.style.color="#f87171"} onMouseLeave={e => e.currentTarget.style.color="#374151"}>
                          <XIcon size={12} />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* PRODUCTS TAB */}
              {detailTab === "products" && (
                <div>
                  <div style={{ display: "flex", flexDirection: "column", gap: "7px", marginBottom: "12px" }}>
                    <input value={newProduct.name} onChange={e => setNewProduct(p => ({ ...p, name: e.target.value }))}
                      placeholder="Product name…" style={S} />
                    <div style={{ display: "flex", gap: "7px" }}>
                      <input value={newProduct.note} onChange={e => setNewProduct(p => ({ ...p, note: e.target.value }))}
                        onKeyDown={e => e.key === "Enter" && addProduct(detailRoutine.id)}
                        placeholder="Note e.g. dosage, brand… (optional)" style={{ ...S, flex: 1 }} />
                      <button onClick={() => addProduct(detailRoutine.id)} style={{ padding: "10px 13px", borderRadius: "10px", border: "none", background: "rgba(129,140,248,0.2)", color: "#a5b4fc", cursor: "pointer", flexShrink: 0 }}><PlusIcon /></button>
                    </div>
                  </div>
                  {(!detailRoutine.products || detailRoutine.products.length === 0) && (
                    <div style={{ textAlign: "center", padding: "22px", color: "#4b5563", fontSize: "13px" }}>No products yet — add items you use</div>
                  )}
                  <div style={{ display: "flex", flexDirection: "column", gap: "7px" }}>
                    {detailRoutine.products?.map(prod => (
                      <div key={prod.id} style={{
                        display: "flex", alignItems: "center", gap: "10px",
                        background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)",
                        borderRadius: "10px", padding: "10px 12px"
                      }}>
                        <div style={{ width: "30px", height: "30px", borderRadius: "8px", background: "rgba(129,140,248,0.12)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color: "#818cf8" }}>
                          <PackageIcon size={14} />
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: "13px", fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{prod.name}</div>
                          {prod.note && <div style={{ fontSize: "11px", color: "#6b7280", marginTop: "1px" }}>{prod.note}</div>}
                        </div>
                        <button onClick={() => deleteProduct(detailRoutine.id, prod.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#374151", padding: "2px", flexShrink: 0 }}
                          onMouseEnter={e => e.currentTarget.style.color="#f87171"} onMouseLeave={e => e.currentTarget.style.color="#374151"}>
                          <XIcon size={12} />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ── Add Routine Modal ─────────────────────────────────── */}
      {showAdd && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", backdropFilter: "blur(8px)", zIndex: 100, display: "flex", alignItems: "flex-end", justifyContent: "center" }}
          onClick={() => setShowAdd(false)}>
          <div style={{ background: "#131726", border: "1px solid rgba(255,255,255,0.1)", borderRadius: "24px 24px 0 0", padding: "18px 20px 28px", width: "100%", maxWidth: "480px", maxHeight: "90vh", overflowY: "auto" }}
            onClick={e => e.stopPropagation()}>
            <div style={{ width: "36px", height: "4px", background: "rgba(255,255,255,0.12)", borderRadius: "2px", margin: "0 auto 16px" }} />
            <h2 style={{ fontSize: "16px", fontWeight: 700, margin: "0 0 16px" }}>New Routine</h2>

            <div style={{ marginBottom: "13px" }}>
              <div style={{ fontSize: "10px", color: "#6b7280", marginBottom: "7px", fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em" }}>Icon</div>
              <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                {EMOJIS.map(e => (
                  <button key={e} onClick={() => setNewRoutine(p => ({ ...p, emoji: e }))} style={{
                    width: "32px", height: "32px", borderRadius: "7px", fontSize: "16px",
                    background: newRoutine.emoji === e ? "rgba(129,140,248,0.2)" : "rgba(255,255,255,0.04)",
                    border: newRoutine.emoji === e ? "1.5px solid #818cf8" : "1px solid rgba(255,255,255,0.08)", cursor: "pointer"
                  }}>{e}</button>
                ))}
              </div>
            </div>

            <div style={{ marginBottom: "11px" }}>
              <div style={{ fontSize: "10px", color: "#6b7280", marginBottom: "5px", fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em" }}>Name</div>
              <input value={newRoutine.name} onChange={e => setNewRoutine(p => ({ ...p, name: e.target.value }))} placeholder="e.g. Morning meditation" style={S} />
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "9px", marginBottom: "11px" }}>
              <div>
                <div style={{ fontSize: "10px", color: "#6b7280", marginBottom: "5px", fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em" }}>Category</div>
                <select value={newRoutine.category} onChange={e => setNewRoutine(p => ({ ...p, category: e.target.value }))} style={S}>
                  {Object.entries(CATEGORIES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                </select>
              </div>
              <div>
                <div style={{ fontSize: "10px", color: "#6b7280", marginBottom: "5px", fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em" }}>Time</div>
                <input type="time" value={newRoutine.time} onChange={e => setNewRoutine(p => ({ ...p, time: e.target.value }))} style={S} />
              </div>
            </div>

            <div style={{ marginBottom: "18px" }}>
              <div style={{ fontSize: "10px", color: "#6b7280", marginBottom: "6px", fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em" }}>Days</div>
              <div style={{ display: "flex", gap: "5px" }}>
                {DAYS.map((day, i) => (
                  <button key={day} onClick={() => toggleDay(i)} style={{
                    flex: 1, padding: "6px 2px", borderRadius: "7px", fontSize: "10px", fontWeight: 600,
                    background: newRoutine.days.includes(i) ? "rgba(129,140,248,0.2)" : "rgba(255,255,255,0.04)",
                    border: newRoutine.days.includes(i) ? "1.5px solid #818cf8" : "1px solid rgba(255,255,255,0.08)",
                    color: newRoutine.days.includes(i) ? "#a5b4fc" : "#4b5563", cursor: "pointer"
                  }}>{day}</button>
                ))}
              </div>
            </div>

            <button onClick={addRoutine} disabled={!newRoutine.name.trim()} style={{
              width: "100%", padding: "13px", borderRadius: "12px", border: "none",
              background: newRoutine.name.trim() ? "linear-gradient(135deg,#818cf8,#34d399)" : "rgba(255,255,255,0.06)",
              color: newRoutine.name.trim() ? "#fff" : "#4b5563",
              fontSize: "14px", fontWeight: 700, cursor: newRoutine.name.trim() ? "pointer" : "not-allowed"
            }}>Add Routine</button>
          </div>
        </div>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RoutineTracker/>);
  </script>

  <!-- Service Worker for offline support -->

  <script>
    if ("serviceWorker" in navigator) {
      const swCode = `
        const CACHE = "rebirth-v1";
        self.addEventListener("install", e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(["./"]).catch(()=>{})));
          self.skipWaiting();
        });
        self.addEventListener("activate", e => { self.clients.claim(); });
        self.addEventListener("fetch", e => {
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match("./"))));
        });
      `;
      const blob = new Blob([swCode], {type: "application/javascript"});
      const swURL = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swURL).catch(()=>{});
    }
  </script>

</body>
